[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-films-telemetry"
version = "0.1.0"
description = "Cost Optimization Telemetry Agent for Agentic Cinema using Google ADK and ClickHouse MCP"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Allan", email = "allan@example.com"}
]
dependencies = [
    "google-adk>=1.18.0",
    "google-genai>=1.47.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "clickhouse-connect>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.setuptools.packages.find]
include = ["telemetry_agent*"]
